# aho 0.2.16 W3 — Anomaly detection rules
#
# Format: Prometheus alerting rules YAML.
# Rule expressions match plan §W3 table verbatim except where called out in
# pillar-11-monitoring-notes.md §"Plan inconsistencies surfaced".
#
# Status: rule expressions written, NOT yet evaluated against a running engine.
# Rule 5 (ToolDurationOutlier) carries a calibrated baseline computed from
# observed W1+W2 metrics — see pillar-11-monitoring-notes.md §"Baseline calibration".

groups:
  - name: aho.anomaly
    interval: 30s
    rules:

      # Rule 3: ClaudeAPIErrorSpike
      # Plan §W3 expression: `rate(claude_code_api_error[5m]) > 1`
      # Plan §W3 parenthetical: "(>5 in 5m)" — note this is inconsistent with the
      # formal expr (rate > 1 ≈ >300 events in 5m, not 5). Rule below uses the
      # formal expression verbatim per W3 brief instruction "match plan table
      # exactly". The discrepancy is documented in pillar-11-monitoring-notes.md
      # §"Plan inconsistencies surfaced" for plan-doc correction.
      - alert: ClaudeAPIErrorSpike
        expr: rate(claude_code_api_error[5m]) > 1
        for: 5m
        labels:
          severity: important
          aho_iteration: "0.2.16"
        annotations:
          summary: "Claude Code API error rate elevated"
          description: >-
            claude_code.api_error rate over the last 5 minutes exceeds 1
            event/second (sustained). Indicates upstream API instability,
            credential issue, or local network failure. Correlate with provider
            status and recent session activity.
          runbook: "artifacts/iterations/0.2.16/pillar-11-monitoring-notes.md"

      # Rule 4: ClaudeCostAnomaly
      - alert: ClaudeCostAnomaly
        expr: increase(claude_code_cost_usage[10m]) > 2.0
        for: 0m
        labels:
          severity: important
          aho_iteration: "0.2.16"
        annotations:
          summary: "Claude Code cost spend exceeded $2.00 in 10 minutes"
          description: >-
            claude_code.cost.usage delta exceeded $2.00 over the last 10 minutes.
            Pillar 8 cost-attribution check. Inspect the W1 cost dashboard for
            the spending workstream; verify session is intentional and not a
            runaway loop or context-window blowout. Threshold per plan §W3 row 4.
          runbook: "artifacts/iterations/0.2.16/pillar-11-monitoring-notes.md"

      # Rule 5: ToolDurationOutlier
      # Threshold = baseline_p99 * 3 = 2411 ms. Baseline_p99 = 804 ms,
      # calibrated W3 bucket 6 from 21 ``claude_code.tool_result`` log events
      # in W2 (W1 absent from on-disk logs file — see pillar-11-monitoring-notes.md
      # §"Baseline calibration" for sample-size limitations and re-runnability).
      #
      # IMPORTANT: this rule's metric reference
      # ``claude_code_tool_result_duration_ms_bucket`` does NOT exist in the
      # current Claude Code emission set — duration_ms is recorded only as a
      # ``claude_code.tool_result`` log event attribute, not a histogram
      # metric. The expression is correct for an Alertmanager-compatible
      # engine fed by a Prometheus-style histogram, but a metric source must
      # be supplied at engine wire-up time. See pillar-11-monitoring-notes.md
      # §"Plan inconsistencies" item 2 for the three resolution options.
      - alert: ToolDurationOutlier
        expr: histogram_quantile(0.99, sum by (le) (rate(claude_code_tool_result_duration_ms_bucket[5m]))) > 2411
        for: 5m
        labels:
          severity: info
          aho_iteration: "0.2.16"
        annotations:
          summary: "Claude Code tool execution p99 latency above baseline × 3"
          description: >-
            p99 of claude_code.tool_result.duration_ms over the last 5 minutes
            exceeded 3× the W2 baseline of 804 ms (threshold 2411 ms).
            Indicates a slow tool (long-running shell, hung MCP server, or a
            blocking subprocess). Inspect tool spans in Jaeger for the offending
            session.
          runbook: "artifacts/iterations/0.2.16/pillar-11-monitoring-notes.md"
