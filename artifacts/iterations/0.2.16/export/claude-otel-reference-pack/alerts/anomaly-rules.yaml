# Claude Code anomaly detection rules: API-error spike, cost anomaly,
# tool-duration outlier. Format is Prometheus alerting rules YAML.
#
# Thresholds in this file (cost $2.00/10m, tool-duration p99 baseline)
# were calibrated against one specific deployment. Recalibrate against
# your own session distributions before relying on them — see
# ../README.md §"Calibration".
#
# Status: rule expressions only. Consumer must wire to their own
# Alertmanager-compatible engine.

groups:
  - name: claude-code.anomaly
    interval: 30s
    rules:

      # Rule: ClaudeAPIErrorSpike
      # The expression below evaluates to "rate exceeds 1 event/second
      # sustained over 5m" (equivalent to ~300 events in 5m). If your intent
      # is "more than 5 events in 5m" replace with
      # `increase(claude_code_api_error[5m]) > 5`. See README §"Calibration"
      # for the discrepancy that surfaced during reference-pack assembly.
      - alert: ClaudeAPIErrorSpike
        expr: rate(claude_code_api_error[5m]) > 1
        for: 5m
        labels:
          severity: important
        annotations:
          summary: "Claude Code API error rate elevated"
          description: >-
            claude_code.api_error rate over the last 5 minutes exceeds 1
            event/second sustained. Indicates upstream API instability,
            credential issue, or local network failure.

      - alert: ClaudeCostAnomaly
        expr: increase(claude_code_cost_usage[10m]) > 2.0
        for: 0m
        labels:
          severity: important
        annotations:
          summary: "Claude Code cost spend exceeded $2.00 in 10 minutes"
          description: >-
            claude_code.cost.usage delta exceeded $2.00 over the last
            10 minutes. Inspect the spending session for runaway loops or
            context-window blowout.

      # Rule: ToolDurationOutlier
      # The metric reference `claude_code_tool_result_duration_ms_bucket`
      # is aspirational: in current Claude Code versions, duration_ms is
      # emitted as a log-event attribute on `claude_code.tool_result`,
      # NOT as a Prometheus-style histogram metric. To use this rule you
      # must supply the histogram via one of:
      #   1. A log-to-metric recording rule in your engine (Loki+LogQL,
      #      VictoriaLogs+vmalert, etc.) that derives the histogram from
      #      the event stream.
      #   2. A custom OTel-collector processor that converts the log
      #      attribute to a histogram metric upstream.
      #   3. Rewrite the rule against a non-histogram source (e.g. monitor
      #      max duration over window via a recording rule).
      # See README §"ToolDurationOutlier metric source" for context.
      #
      # Threshold value 2411 ms is calibrated against one deployment's
      # observed p99 (804 ms) × 3. RECALIBRATE for your environment.
      - alert: ToolDurationOutlier
        expr: histogram_quantile(0.99, sum by (le) (rate(claude_code_tool_result_duration_ms_bucket[5m]))) > 2411
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Claude Code tool execution p99 latency above baseline × 3"
          description: >-
            p99 of claude_code.tool_result.duration_ms over the last 5 minutes
            exceeded 3× the calibrated baseline. Indicates a slow tool
            (long-running shell, hung MCP server, or a blocking subprocess).
